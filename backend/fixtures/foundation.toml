# Synthetic M0 foundation fixtures. Tenant names, people and marker strings live
# only here (and in tests that load this file); application code has no
# tenant-specific branches. No passwords are stored here: the explicit dev seed
# generates them and writes them to a git-ignored, owner-only file.
#
# Capabilities used:  resource.read, resource.admin, dataset.query, identity.admin, audit.read,
#                     tenant.config (see app/security/policy.py)
# Tenant settings:    enabled packs/connectors and sync mode (app/tenancy/config.py, M4)
# Resource kinds:     document (default), dataset (M2 report sources)
# Grant actions:      resource.read (default), dataset.query
# Attributes used:    clearance (public < internal < confidential < restricted),
#                     country (ISO 3166-1 alpha-2), department (lowercase key)

version = 1

[[tenants]]
slug = "niletech"
name = "NileTech Solutions"

  # M4 tenant configuration: both packs, upload and Google Drive, 15-minute demo sync.
  [tenants.settings]
  enabled_packs = ["documents", "sales_reports"]
  enabled_connectors = ["upload", "google_drive"]
  sync_mode = "demo"

  [[tenants.roles]]
  key = "reader"
  name = "Reader"
  capabilities = ["resource.read"]

  [[tenants.roles]]
  key = "department_admin"
  name = "Department administrator"
  capabilities = ["resource.admin", "identity.admin", "audit.read"]

  [[tenants.roles]]
  key = "report_reader"
  name = "Sales report reader"
  capabilities = ["dataset.query"]

  [[tenants.roles]]
  key = "access_admin"
  name = "Tenant access administrator"
  capabilities = ["resource.admin", "identity.admin", "audit.read", "tenant.config"]

  [[tenants.groups]]
  key = "all-staff"
  name = "All staff"

  [[tenants.groups]]
  key = "finance-team"
  name = "Finance team"

  [[tenants.users]]
  key = "finance-reader"
  email = "finance.reader@niletech.example"
  display_name = "Finance Reader"
  status = "active"
  clearance = "confidential"
  country = "EG"
  department = "finance"
  roles = [{ role = "reader" }, { role = "report_reader" }]
  groups = ["all-staff", "finance-team"]

  [[tenants.users]]
  key = "sales-reader"
  email = "sales.reader@niletech.example"
  display_name = "Sales Reader (unauthorized for finance)"
  status = "active"
  clearance = "internal"
  country = "AE"
  department = "sales"
  roles = [{ role = "reader" }]
  groups = ["all-staff"]

  [[tenants.users]]
  key = "denied-reader"
  email = "denied.reader@niletech.example"
  display_name = "Finance Reader with explicit deny"
  status = "active"
  clearance = "confidential"
  country = "EG"
  department = "finance"
  roles = [{ role = "reader" }, { role = "report_reader" }]
  groups = ["all-staff", "finance-team"]

  [[tenants.users]]
  key = "board-member"
  email = "board.member@niletech.example"
  display_name = "Board Member (direct grant)"
  status = "active"
  clearance = "restricted"
  country = "EG"
  department = "finance"
  roles = [{ role = "reader" }]
  groups = ["all-staff"]

  [[tenants.users]]
  key = "finance-admin"
  email = "finance.admin@niletech.example"
  display_name = "Finance Department Admin"
  status = "active"
  clearance = "internal"
  country = "EG"
  department = "finance"
  roles = [{ role = "department_admin", scope_department = "finance" }]
  groups = []

  [[tenants.users]]
  key = "access-admin"
  email = "access.admin@niletech.example"
  display_name = "Tenant Access Admin"
  status = "active"
  clearance = "internal"
  country = "EG"
  department = "it"
  roles = [{ role = "access_admin" }]
  groups = []

  [[tenants.users]]
  key = "inactive-reader"
  email = "inactive.reader@niletech.example"
  display_name = "Inactive Reader"
  status = "inactive"
  clearance = "confidential"
  country = "EG"
  department = "finance"
  roles = [{ role = "reader" }, { role = "report_reader" }]
  groups = ["all-staff", "finance-team"]

  [[tenants.resources]]
  key = "company-overview"
  title = "Company overview NILETECH-PUBLIC-MARKER-1001"
  classification = "public"
  department = "marketing"
  department_restricted = false
  allowed_countries = ["*"]
  grants = [{ group = "all-staff", effect = "allow" }]

  [[tenants.resources]]
  key = "hr-policies"
  title = "HR policies NILETECH-INTERNAL-MARKER-2002"
  classification = "internal"
  department = "hr"
  department_restricted = false
  allowed_countries = ["*"]
  grants = [{ group = "all-staff", effect = "allow" }]

  [[tenants.resources]]
  key = "finance-report"
  title = "Quarterly finance report NILETECH-FINANCE-SECRET-7421"
  classification = "confidential"
  department = "finance"
  department_restricted = true
  allowed_countries = ["EG"]
  grants = [
    { group = "finance-team", effect = "allow" },
    { user = "denied-reader", effect = "deny" },
  ]

  [[tenants.resources]]
  key = "payroll-report"
  title = "Payroll report NILETECH-RESTRICTED-MARKER-9090"
  classification = "restricted"
  department = "finance"
  department_restricted = true
  allowed_countries = ["EG"]
  grants = [{ user = "board-member", effect = "allow" }]

  # M2: the whole tenant sales dataset as one protected report source. There are
  # no finer row-level business permissions inside a tenant (ADR 0202).
  [[tenants.resources]]
  key = "sales-reporting"
  kind = "dataset"
  title = "Sales reporting dataset"
  classification = "confidential"
  department = "finance"
  department_restricted = true
  allowed_countries = ["EG"]
  grants = [
    { group = "finance-team", effect = "allow", action = "dataset.query" },
    { user = "denied-reader", effect = "deny", action = "dataset.query" },
  ]

  # Tenant configuration for the first supported report. Application code reads
  # these values; it has no tenant-specific branches.
  [[tenants.report_profiles]]
  key = "sales.fulfilled"
  resource = "sales-reporting"
  version = 1
  [tenants.report_profiles.config]
  title = "Fulfilled sales"
  currency = "USD"
  date_basis = "order_date"
  included_statuses = ["FULFILLED"]
  status_domain = ["FULFILLED", "PENDING", "CANCELLED"]
  net_measure = "subtotal"
  tax_measure = "tax"
  gross_measure = "total"
  tax_treatment = "net sales are tax-exclusive; gross = net + tax"
  periods = ["quarter", "month"]
  fiscal_year_start_month = 1

